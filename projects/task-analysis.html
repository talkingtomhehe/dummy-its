<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tasks Analysis Reporting</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0014A8",
              "secondary": "#29ABCB",
              "done": "#2E7D31",
              "in-progress": "#FBC02D",
              "new": "#29ABCB",
              "blocked": "#E53835",
              "background-light": "#f5f6f8",
              "background-dark": "#0f1123",
            },
            fontFamily: {
              "display": ["Roboto", "sans-serif"],
              "sans": ["Roboto", "sans-serif"],
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .chart-grid-line {
            border-bottom: 1px solid #e5e7eb;
        }
        circle {
  vector-effect: non-scaling-stroke;
}

    </style>
</head>
<body class="bg-[#F9FAFB] text-[#101118] font-display h-screen flex flex-col overflow-hidden">
<header class="flex items-center justify-between whitespace-nowrap bg-primary px-4 py-2 shrink-0 z-20 shadow-md">
<div class="flex items-center gap-4 text-white/80">
<button class="flex items-center justify-center p-1 hover:text-white rounded">
<span class="material-symbols-outlined text-[24px]">apps</span>
</button>
<div class="flex flex-col">
<h2 class="text-white text-base font-bold leading-tight tracking-tight">PROJECTS</h2>
</div>
<nav class="hidden md:flex items-center gap-6 ml-4 text-sm font-medium text-white/90">
  <a class="text-white" href="#">Projects</a>
  <a class="hover:text-white" href="#">Tasks</a>
  <a class="hover:text-white" href="#">Reporting</a>
  <a class="hover:text-white" href="#">Configuration</a>
</nav>
</div>
<div class="flex items-center gap-4">
<button class="text-white/80 hover:text-white relative">
<span class="material-symbols-outlined text-[20px]">schedule</span>
</button>
<button class="text-white/80 hover:text-white relative">
<span class="material-symbols-outlined text-[20px]">chat_bubble</span>
<span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-[#E53835] ring-2 ring-primary transform translate-x-1/2 -translate-y-1/2"></span>
</button>
<div class="bg-center bg-no-repeat bg-cover rounded-full h-8 w-8 border border-white/20 cursor-pointer" data-alt="User Avatar" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCrtHkvelBpaYarklRLynYIvwiKO3PJoyX61M9rEfSXCefo80fsa24kkZfg0DWV3dgz6nUbD6jh364tBk1jBdLormL1jkK3HL4EslM15x_1sQpy4l08JfymGvkmu1Jy3gAZz1RbErA5boAfvUEtckyMrukmyRJbDqA03kxyyXNSwB0J0NYb0A7S64rVTRGAGhznKLolcDxtoXziN8SVIDhrTsqOXAhbNhJim9zonklO3A8RW7pU_vxfJ17SJltMnsn_5b6ZLZkOgyQ");'></div>
</div>
</header>
<div class="bg-white border-b border-[#E7E9ED] px-4 py-2 flex flex-col md:flex-row gap-4 items-center justify-between shrink-0 z-10 shadow-sm">
<div class="flex items-center gap-4 w-full md:w-auto">
<h1 class="text-gray-800 font-medium text-sm tracking-tight">Tasks Analysis</h1>
</div>
<div class="flex-1 w-full md:max-w-xl mx-4">
<div class="relative group">
<div class="flex items-center w-full border border-gray-300 rounded focus-within:ring-1 focus-within:ring-primary focus-within:border-primary overflow-hidden bg-white h-9">
<div class="pl-2 pr-1 text-gray-400 flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">search</span>
</div>
<input class="w-full border-none focus:ring-0 p-0 text-sm text-gray-700 placeholder:text-gray-400 h-full pl-2" placeholder="Search..." type="text"/>
<button class="pr-2 text-gray-400 hover:text-gray-600">
<span class="material-symbols-outlined text-[20px]">arrow_drop_down</span>
</button>
</div>
</div>
</div>
<div class="flex items-center justify-end w-full md:w-auto">
<div class="flex bg-gray-100 p-0.5 rounded-md border border-gray-200">
<button class="p-1.5 rounded-sm text-gray-500 hover:text-gray-700 hover:bg-gray-200 transition-colors" title="Kanban View">
<span class="material-symbols-outlined text-[18px] block">view_kanban</span>
</button>
<button class="p-1.5 rounded-sm text-gray-500 hover:text-gray-700 hover:bg-gray-200 transition-colors" title="List View">
<span class="material-symbols-outlined text-[18px] block">format_list_bulleted</span>
</button>
<button class="p-1.5 rounded bg-white text-[#0175C8] shadow-sm" title="Graph View">
<span class="material-symbols-outlined text-[18px] block">monitoring</span>
</button>
<button class="p-1.5 rounded-sm text-gray-400 hover:text-gray-600 hover:bg-gray-200 transition-colors" title="Pivot View">
<span class="material-symbols-outlined text-[18px] block">pivot_table_chart</span>
</button>
</div>
</div>
</div>
<div class="bg-white border-b border-[#E7E9ED] px-4 py-2 flex items-center gap-4 shrink-0 shadow-sm z-0">
<button class="flex items-center gap-2 bg-[#0175C8] text-white text-sm font-medium px-3 py-1.5 rounded shadow-sm hover:bg-primary/90 transition-colors">
<span>Measures</span>
<span class="material-symbols-outlined text-[18px]">arrow_drop_down</span>
</button>
<div class="h-6 w-px bg-gray-300 mx-2"></div>
<div class="flex items-center bg-gray-100 rounded p-0.5 border border-gray-200">
<button class="p-1.5 rounded-sm bg-white text-[#0175C8] shadow-sm" title="Bar Chart">
<span class="material-symbols-outlined text-[20px] block">bar_chart</span>
</button>
<button class="p-1.5 rounded-sm text-gray-500 hover:text-gray-700 hover:bg-gray-200 transition-colors" title="Line Chart">
<span class="material-symbols-outlined text-[20px] block">show_chart</span>
</button>
<button class="p-1.5 rounded-sm text-gray-500 hover:text-gray-700 hover:bg-gray-200 transition-colors" title="Pie Chart">
<span class="material-symbols-outlined text-[20px] block">pie_chart</span>
</button>
</div>
</div>
<main class="flex-1 overflow-hidden p-6 bg-white flex flex-col min-h-0 relative">
<div class="absolute top-6 right-6 flex items-center gap-4 text-xs font-medium z-10 bg-white/80 p-2 rounded backdrop-blur-sm">
<div class="flex items-center gap-1.5">
<div class="w-3 h-3 bg-new rounded-sm"></div>
<span class="text-gray-600">New</span>
</div>
<div class="flex items-center gap-1.5">
<div class="w-3 h-3 bg-done rounded-sm"></div>
<span class="text-gray-600">Done</span>
</div>
<div class="flex items-center gap-1.5">
<div class="w-3 h-3 bg-in-progress rounded-sm"></div>
<span class="text-gray-600">In Progress</span>
</div>
<div class="flex items-center gap-1.5">
  <div class="w-3 h-3 bg-blocked rounded-sm"></div>
  <span class="text-gray-600">Blocked</span>
</div>
<div class="flex items-center gap-1.5">
<div class="w-4 h-0.5 bg-gray-400 relative flex items-center justify-center">
<div class="w-1.5 h-1.5 bg-black rounded-full absolute"></div>
</div>
<span class="text-gray-600">Sum</span>
</div>
</div>
<div class="flex-1 flex flex-col relative mt-8 pb-8 pr-8">
<div class="flex-1 flex w-full h-full relative">
<div class="flex flex-col justify-between text-xs text-gray-500 pr-3 text-right w-12 shrink-0 h-full py-6 select-none">
<span>18.00</span>
<span>15.00</span>
<span>12.00</span>
<span>9.00</span>
<span>6.00</span>
<span>3.00</span>
<span>0.00</span>
</div>
<div class="relative flex-1 h-full border-l border-b border-gray-300">
<div class="absolute inset-0 flex flex-col justify-between pointer-events-none py-6">
<div class="w-full border-t border-gray-100"></div> 
<div class="w-full border-t border-gray-100"></div> 
<div class="w-full border-t border-gray-100"></div> 
<div class="w-full border-t border-gray-100"></div> 
<div class="w-full border-t border-gray-100"></div> 
<div class="w-full border-t border-gray-100"></div> 
<div class="w-full border-t border-transparent"></div> 
</div>
<div class="absolute inset-0 flex items-end justify-around px-10 pb-[1px] pt-6">
<div class="relative w-24 h-full flex items-end group">
<div class="w-full flex flex-col shadow-sm transition-transform hover:scale-[1.02] cursor-pointer" style="height: 58%;"> 
<div class="w-full bg-new flex-1 border-b border-white/20" title="New: 3.5"></div> 
<div class="w-full bg-done flex-1 border-b border-white/20" title="Done: 3.5"></div> 
<div class="w-full bg-in-progress flex-1" title="In Progress: 3.5"></div> 
</div>
<div class="absolute inset-0 z-10"></div>
</div>
<div class="relative w-24 h-full flex items-end group">
<div class="w-full flex flex-col shadow-sm transition-transform hover:scale-[1.02] cursor-pointer" style="height: 83%;"> 
<div class="w-full bg-new h-[25%] border-b border-white/20" title="New: 3.75"></div>
<div class="w-full bg-done h-[35%] border-b border-white/20" title="Done: 5.25"></div>
<div class="w-full bg-in-progress h-[40%]" title="In Progress: 6.0"></div>
</div>
<div class="absolute inset-0 z-10"></div>
</div>
<div class="relative w-24 h-full flex items-end group">
<div class="w-full flex flex-col shadow-sm transition-transform hover:scale-[1.02] cursor-pointer" style="height: 42%;"> 
<div class="w-full bg-new h-[40%] border-b border-white/20" title="New: 3.0"></div>
<div class="w-full bg-done h-[30%] border-b border-white/20" title="Done: 2.25"></div>
<div class="w-full bg-in-progress h-[30%]" title="In Progress: 2.25"></div>
</div>
<div class="absolute inset-0 z-10"></div>
</div>
</div>
<!-- LINE (co giãn) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none z-20" style="padding-bottom: 0; padding-top: 24px" viewBox="0 0 100 100" preserveAspectRatio="none">
  <polyline points="18.8,42 50,17 81.2,58" fill="none" stroke="#263238" stroke-width="0.2" />
</svg>

<!-- DOTS (px thật, không méo) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none z-30" style="padding-bottom: 0; padding-top: 24px">
  <circle cx="18.8%" cy="42%" r="4" fill="black" />
  <circle cx="50%" cy="17%" r="4" fill="black" />
  <circle cx="81.2%" cy="58%" r="4" fill="black" />
</svg>

</div>
</div>
<div class="flex w-full pl-12 pr-0 mt-2">
<div class="flex-1 flex justify-around px-10">
<div class="w-24 text-center">
<span class="text-xs font-medium text-gray-600 block truncate">Office Design</span>
</div>
<div class="w-24 text-center">
<span class="text-xs font-medium text-gray-600 block truncate">Renovations</span>
</div>
<div class="w-24 text-center">
<span class="text-xs font-medium text-gray-600 block truncate">Research &amp; Dev</span>
</div>
</div>
</div>
</div>
</main>
