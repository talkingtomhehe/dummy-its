<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Project Tasks View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0014a8",
              "secondary": "#0175C8",
              "background-light": "#f5f6f8",
              "background-dark": "#0f1123",
              "tprimary": "#263238",
            },
            fontFamily: {
              "display": ["Roboto", "sans-serif"],
              "sans": ["Roboto", "sans-serif"],
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            keyframes: {
              'slide-up': {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' }
              }
            },
            animation: {
              'slide-up': 'slide-up 0.3s ease-out'
            }
          },
        },
      }
    </script>
<style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#F9FAFB] text-[#101118] font-display h-screen flex flex-col overflow-hidden">
<header class="flex items-center justify-between whitespace-nowrap bg-primary px-4 py-2 shrink-0 z-20 shadow-md">
<div class="flex items-center gap-4 text-white/80">
    <a href="../home.html">
    <button class="flex items-center justify-center p-1 hover:text-white rounded">
        <span class="material-symbols-outlined text-[24px]">apps</span>
    </button>
    </a>
    <div class="flex flex-col">
        <h2 class="text-white text-base font-bold leading-tight tracking-tight">PROJECTS</h2>
    </div>
    <!-- Menu Items / Breadcrumbs Placeholder in Header (Optional in Odoo, sticking to requested minimal header) -->
    <div class="hidden md:flex gap-6 ml-4 text-sm font-medium text-white/80">
        <a class="text-white" href="#">Projects</a>
        <a class="hover:text-white" href="#">Tasks</a>
        <a class="hover:text-white" href="#">Reporting</a>
        <a class="hover:text-white" href="#">Configuration</a>
    </div>
</div>
<div class="flex items-center gap-4">
<button class="text-white/80 hover:text-white relative">
<span class="material-symbols-outlined text-[20px]">schedule</span>
</button>
<button class="text-white/80 hover:text-white relative">
<span class="material-symbols-outlined text-[20px]">chat_bubble</span>
<span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-[#E53835] ring-2 ring-primary transform translate-x-1/2 -translate-y-1/2"></span>
</button>
<div class="bg-center bg-no-repeat bg-cover rounded-full h-8 w-8 border border-white/20 cursor-pointer" data-alt="User Avatar" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCrtHkvelBpaYarklRLynYIvwiKO3PJoyX61M9rEfSXCefo80fsa24kkZfg0DWV3dgz6nUbD6jh364tBk1jBdLormL1jkK3HL4EslM15x_1sQpy4l08JfymGvkmu1Jy3gAZz1RbErA5boAfvUEtckyMrukmyRJbDqA03kxyyXNSwB0J0NYb0A7S64rVTRGAGhznKLolcDxtoXziN8SVIDhrTsqOXAhbNhJim9zonklO3A8RW7pU_vxfJ17SJltMnsn_5b6ZLZkOgyQ");'></div>
</div>
</header>
<div class="bg-white border-b border-[#E7E9ED] px-4 py-2 flex flex-col md:flex-row gap-4 items-center justify-between shrink-0 z-10 shadow-sm">
<div class="flex items-center gap-4 w-full md:w-auto">
<button
    class="hover:bg-[#0175C8] hover:text-white text-[#0175C8] text-sm font-medium border border-[#0175C8] px-4 py-2 rounded shadow-sm flex items-center gap-2 transition-colors">
    <span class="material-symbols-outlined text-[18px] font-bold">add</span>
    <span>New</span>
</button>
<nav class="hidden sm:flex text-sm">
<ol class="flex items-center gap-2">
<li><a class="text-gray-500 hover:text-gray-900 transition-colors" href="#">Home Construction</a></li>
<li class="text-gray-400">/</li>
<li><span class="text-gray-800 font-medium">Tasks</span></li>
</ol>
</nav>
</div>
<div class="flex-1 w-full md:max-w-xl mx-4">
    <div class="relative group">
        <div
            class="flex items-center w-full border border-gray-300 rounded focus-within:ring-1 focus-within:ring-primary focus-within:border-primary overflow-hidden bg-white h-9">
            <!-- Icon -->
            <div class="pl-2 pr-1 text-gray-400 flex items-center justify-center">
                <span class="material-symbols-outlined text-[20px]">search</span>
            </div>
            <!-- Filter Chip inside Search -->
            <div
                class="flex items-center gap-1 bg-[#0175C8]/10 text-[#0175C8] border border-[#0175C8]/20 rounded px-2 py-0.5 text-xs font-medium whitespace-nowrap mr-2 select-none">
                <span>Open Tasks</span>
                <button class="hover:bg-primary/20 rounded-full p-0.5 flex items-center justify-center">
                    <span class="material-symbols-outlined text-[14px]">close</span>
                </button>
            </div>
            <input class="w-full border-none focus:ring-0 p-0 text-sm text-gray-700 placeholder:text-gray-400 h-full"
                placeholder="Search..." type="text" />
            <button class="pr-2 text-gray-400 hover:text-gray-600">
                <span class="material-symbols-outlined text-[20px]">arrow_drop_down</span>
            </button>
        </div>
    </div>
</div>
<div class="flex items-center justify-end w-full md:w-auto">
    <div class="flex bg-gray-100 p-0.5 rounded-md border border-gray-200">
        <button class="p-1.5 rounded bg-white text-[#0175C8] shadow-sm">
            <span class="material-symbols-outlined text-[18px] block">view_kanban</span>
        </button>
        <button class="p-1.5 rounded text-gray-500 hover:text-gray-700 hover:bg-gray-200/50">
            <span class="material-symbols-outlined text-[18px] block">format_list_bulleted</span>
        </button>
        <button class="p-1.5 rounded text-gray-500 hover:text-gray-700 hover:bg-gray-200/50 hidden lg:block">
            <span class="material-symbols-outlined text-[18px] block">calendar_month</span>
        </button>
        <button class="p-1.5 rounded text-gray-500 hover:text-gray-700 hover:bg-gray-200/50 hidden lg:block">
            <span class="material-symbols-outlined text-[18px] block">monitoring</span>
        </button>
    </div>
</div>
</div>
<main class="flex-1 overflow-x-auto overflow-y-hidden p-4 md:p-6 bg-[#F9FAFB] min-w-0">
<div class="flex h-full gap-4 items-start min-w-max">
<!-- NEW Column -->
<div class="flex flex-col w-[300px] shrink-0 h-full max-h-full">
<div class="flex items-center justify-between pb-2 group cursor-pointer">
<h3 class="text-gray-700 font-bold text-sm uppercase tracking-wide">New</h3>
<div class="flex items-center opacity-0 group-hover:opacity-100 transition-opacity">
<button class="text-gray-400 hover:text-gray-600 p-1"><span class="material-symbols-outlined text-[18px]">settings</span></button>
<button class="text-gray-400 hover:text-gray-600 p-1"><span class="material-symbols-outlined text-[18px]">add</span></button>
</div>
</div>
<div class="h-1 w-full bg-gray-200 rounded-full mb-3 flex overflow-hidden">
<div class="h-full bg-gray-400" style="width: 0%"></div>
</div>
<div class="flex-1 flex flex-col gap-3 min-h-[100px] overflow-y-auto pr-1 pb-4 scrollbar-hide">
    <!-- Tasks rendered dynamically by project-tasks.js -->
</div>
</div>

<!-- IN PROGRESS Column -->
<div class="flex flex-col w-[300px] shrink-0 h-full max-h-full">
<div class="flex items-center justify-between pb-2 group cursor-pointer">
<h3 class="text-gray-700 font-bold text-sm uppercase tracking-wide">In Progress</h3>
<div class="flex items-center opacity-0 group-hover:opacity-100 transition-opacity">
<button class="text-gray-400 hover:text-gray-600 p-1"><span class="material-symbols-outlined text-[18px]">settings</span></button>
<button class="text-gray-400 hover:text-gray-600 p-1"><span class="material-symbols-outlined text-[18px]">add</span></button>
</div>
</div>
<div class="h-1 w-full bg-gray-200 rounded-full mb-3 flex overflow-hidden">
<div class="h-full bg-[#FBC02D]" style="width: 0%"></div>
</div>
<div class="flex-1 flex flex-col gap-3 overflow-y-auto pr-1 pb-4 scrollbar-hide">
    <!-- Tasks rendered dynamically by project-tasks.js -->
</div>
</div>

<!-- DONE Column -->
<div class="flex flex-col w-[300px] shrink-0 h-full max-h-full">
<div class="flex items-center justify-between pb-2 group cursor-pointer">
<h3 class="text-gray-700 font-bold text-sm uppercase tracking-wide">Done</h3>
<div class="flex items-center opacity-0 group-hover:opacity-100 transition-opacity">
<button class="text-gray-400 hover:text-gray-600 p-1"><span class="material-symbols-outlined text-[18px]">settings</span></button>
<button class="text-gray-400 hover:text-gray-600 p-1"><span class="material-symbols-outlined text-[18px]">add</span></button>
</div>
</div>
<div class="h-1 w-full bg-gray-200 rounded-full mb-3 flex overflow-hidden">
<div class="h-full bg-green-500" style="width: 0%"></div>
</div>
<div class="flex-1 flex flex-col gap-3 overflow-y-auto pr-1 pb-4 scrollbar-hide">
    <!-- Tasks rendered dynamically by project-tasks.js -->
</div>
</div>

<!-- CANCELLED Column (Collapsed) -->
<div class="flex flex-col w-[40px] shrink-0 h-full bg-[#f0f0f5] border border-gray-200 rounded cursor-pointer hover:bg-gray-200 transition-colors items-center py-4">
<div class="flex-1 flex items-center justify-center">
<h3 class="text-gray-500 font-bold text-xs uppercase tracking-wide whitespace-nowrap rotate-90 transform origin-center">
    Cancelled
</h3>
</div>
<div class="mb-2">
<span class="material-symbols-outlined text-gray-500 text-[20px]">arrow_menu_open</span>
</div>
</div>

<!-- ADD STAGE Column -->
<div class="flex flex-col w-[300px] shrink-0 h-full max-h-full opacity-60 hover:opacity-100 transition-opacity">
<div class="flex items-center gap-2 pb-2">
<h3 class="text-gray-400 font-bold text-sm uppercase tracking-wide px-2">Add a Stage</h3>
</div>
<div class="flex-1 border-2 border-dashed border-gray-300 rounded-lg flex items-center justify-center cursor-pointer hover:border-gray-400 hover:bg-gray-50/50">
<div class="flex flex-col items-center gap-2 text-gray-400">
<span class="material-symbols-outlined text-[32px]">add</span>
<span class="text-sm font-medium">Add Column</span>
</div>
</div>
</div>
</div>
</main>

<!-- JavaScript Files -->
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/project-tasks.js"></script>
<script src="../js/app.js"></script>
</body></html>
