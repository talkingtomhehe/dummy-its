<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Company - Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#97D7DD",
                        "background-light": "#F4F6F8", /* Updated to user request */
                        "background-dark": "#23220f",
                        "brand-blue": "#0014A8",
                        "brand-accent": "#29ABCB",
                    },
                    fontFamily: {
                        "display": ["Roboto", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex items-center justify-center p-4">
<!-- Main Login Card Container -->
<div class="w-full max-w-[440px] bg-white dark:bg-[#1a1a1a] rounded-xl shadow-lg p-8 md:p-12 relative overflow-hidden group/card">
<!-- Decorative subtle top border using primary yellow -->
<div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-brand-blue via-primary to-brand-blue opacity-80"></div>
<!-- Logo Section -->
<div class="flex flex-col items-center justify-center mb-10">
<div class="h-16 w-16 bg-brand-blue/5 rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-brand-blue text-4xl">domain</span>
</div>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-2 text-center">Sign in to manage your workspace</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Username Field -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1" for="username">Username</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-brand-blue transition-colors">person</span>
</div>
<input class="block w-full rounded-full border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-primary/50 focus:ring-2 pl-11 pr-4 py-3.5 sm:text-sm transition-all duration-200" id="username" name="username" placeholder="Enter your username" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between ml-1">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold" for="password">Password</label>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-brand-blue transition-colors">lock</span>
</div>
<input class="block w-full rounded-full border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-primary/50 focus:ring-2 pl-11 pr-4 py-3.5 sm:text-sm transition-all duration-200" id="password" name="password" placeholder="Enter your password" type="password"/>
</div>
<div class="text-right mt-1">
    <a class="text-gray-400 hover:text-brand-blue text-sm font-medium transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-full shadow-sm text-sm font-bold text-white bg-brand-blue hover:bg-brand-blue/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue transition-all duration-200 transform hover:-translate-y-0.5 mt-8" type="button" id="login-btn">
    Sign In
</button>
</form>
<!-- Footer Info -->
<div class="mt-8 text-center">
<p class="text-xs text-slate-400 dark:text-slate-500">
                Protected by Enterprise Identity Service. <br/>
<a class="hover:text-brand-blue underline decoration-slate-300 underline-offset-2" href="#">Privacy Policy</a> • <a class="hover:text-brand-blue underline decoration-slate-300 underline-offset-2" href="#">Terms of Service</a>
</p>
</div>
</div>

<!-- JavaScript Files -->
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body></html>
