<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create New Announcement</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0014A6",
                        "secondary": "#29ABCB",
                        "variant": "#0175C8",
                        "background-light": "#F9FAFB",
                        "background-dark": "#0f1123",
                        "dark-gray": "#374151",
                    },
                    fontFamily: {
                        "display": ["Roboto", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#101118] h-screen flex flex-col overflow-hidden">
<header class="bg-primary text-white flex items-center justify-between px-4 py-2 shrink-0 z-20">
<div class="flex items-center gap-4">
    <button class="text-white/80 hover:text-white p-1">
        <span class="material-symbols-outlined text-[24px]">apps</span>
    </button>
    <span class="text-lg font-bold tracking-tight">ANNOUNCEMENTS</span>
    <nav class="hidden md:flex items-center gap-6 ml-4 text-sm font-medium text-white/90">
        <a class="hover:text-white" href="#">Dashboard</a>
        <a class="text-white" href="#">Announcements</a>
        <a class="hover:text-white" href="#">Directory</a>
        <a class="hover:text-white" href="#">Documents</a>
    </nav>
</div>
<div class="flex items-center gap-4">
    <button class="text-white/80 hover:text-white p-1 relative order-2">
        <span class="material-symbols-outlined text-[20px]">schedule</span>
    </button>
    <button class="text-white/80 hover:text-white p-1 relative order-1">
        <span class="material-symbols-outlined text-[20px]">chat_bubble</span>
        <span class="absolute top-0 right-0 size-2 bg-[#E53835] rounded-full border border-primary"></span>
    </button>
    <div class="size-8 rounded-full bg-white/20 overflow-hidden cursor-pointer border border-white/30 order-4">
        <img class="w-full h-full object-cover" data-alt="User profile avatar"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuAtLPoctX8BjJQdmoGiR7oxZnEMkJ4X6GajFyBZQw8NmrB75O_ICMDGudNyRqbr-xgB4T6n0aFvRkgbTQ97JwxHE7qoWveguu6Tp-neBxVCwoq82UL7WL8Unz_EH_bJrXseW1znXjOn1hNSniBevf613YxdXrMy-EVttCR_wzsa-dsx4eudABL144FWfIEvJ1XNHhKbK-mSMgVBRxd2AA3xcnqgdXzBT7Gg5DNnQBDrke9-Buo2GgSBF2EiRG4724oxUi-2ExE5qv4" />
    </div>
</div>
</header>
<div class="bg-white border-b border-[#e0e2e6] px-4 py-3 flex flex-row gap-4 items-center justify-between shrink-0 z-10 shadow-sm h-[56px]">
<div class="flex items-center gap-2 text-sm">
<a class="text-gray-500 hover:text-primary transition-colors hover:underline" href="#">Announcements</a>
<span class="text-gray-300 text-lg">/</span>
<span class="font-medium text-dark-gray">New</span>
</div>
<div class="flex items-center gap-2">
<button class="p-1.5 text-gray-500 hover:text-primary hover:bg-gray-100 rounded transition-colors" title="Save">
<span class="material-symbols-outlined text-[22px]">save</span>
</button>
<button class="p-1.5 text-gray-500 hover:text-red-600 hover:bg-gray-100 rounded transition-colors" title="Discard">
<span class="material-symbols-outlined text-[22px]">close</span>
</button>
</div>
</div>
<main class="flex-1 overflow-y-auto bg-background-light p-6">
<div class="max-w-[900px] mx-auto pb-12">
<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8 mb-8 relative">
<div class="absolute top-0 right-0 mt-6 mr-8">
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600 border border-gray-200">
                        Draft
                    </span>
</div>
<div class="mb-8 pr-16">
<input class="w-full text-3xl font-bold text-gray-900 placeholder-gray-300 border-b border-gray-300 border-t-0 border-l-0 border-r-0 px-0 py-6 focus:ring-0 focus:border-primary transition-colors bg-transparent" placeholder="e.g. Annual Company Retreat" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-6 mb-8">
<div class="space-y-6">
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Target Audience</label>
<div class="flex flex-col gap-2">
<label class="inline-flex items-center">
<input checked="" class="form-radio text-primary focus:ring-primary border-gray-300" name="audience" type="radio"/>
<span class="ml-2 text-sm text-gray-700">All Employees</span>
</label>
<label class="relative inline-flex items-center">
<input class="peer form-radio text-primary focus:ring-primary border-gray-300" name="audience" type="radio"/>
<span class="ml-2 text-sm text-gray-700">Specific Department</span>
<select disabled class="absolute right-0 hidden peer-checked:block w-48 h-9 rounded-md border border-gray-300
           bg-white text-sm text-gray-700 px-3
           focus:border-primary focus:ring-1 focus:ring-primary/20">
    <option value="">Select department</option>
    <option>Human Resources</option>
    <option>Sales</option>
    <option>Marketing</option>
    <option>Finance</option>
    <option>IT</option>
</select>
</label>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Publish Date</label>
<div class="relative">
<input class="form-input block w-full rounded-md border-gray-300 text-sm focus:border-primary focus:ring-primary text-gray-700" type="date" value="2025-10-27"/>
</div>
</div>
</div>
<div class="space-y-6">
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Attachment</label>
<div class="flex items-center justify-center w-full">
<label class="flex flex-col items-center justify-center w-full h-24 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 hover:border-primary/50 transition-colors" for="dropzone-file">
<div class="flex flex-col items-center justify-center pt-5 pb-6">
<span class="material-symbols-outlined text-gray-400 text-2xl mb-1">upload_file</span>
<p class="mb-2 text-xs text-gray-500"><span class="font-semibold text-gray-400">Click to upload</span></p>
</div>
<input class="hidden" id="dropzone-file" type="file"/>
</label>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">Pinned</label>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
<span class="ml-3 text-sm font-medium text-gray-500">Pin to top</span>
</label>
</div>
</div>
</div>
<div>
<div class="flex items-center justify-between mb-2">
<label class="block text-sm font-bold text-gray-900 uppercase tracking-wide">Content</label>
</div>
<div class="border border-gray-300 rounded-md overflow-hidden focus-within:ring-1 focus-within:ring-primary focus-within:border-primary transition-shadow">
<div class="bg-gray-50 border-b border-gray-300 px-3 py-2 flex items-center gap-1">
<button class="p-1 text-gray-500 hover:bg-gray-200 rounded hover:text-gray-700">
<span class="material-symbols-outlined text-[18px]">format_bold</span>
</button>
<button class="p-1 text-gray-500 hover:bg-gray-200 rounded hover:text-gray-700">
<span class="material-symbols-outlined text-[18px]">format_italic</span>
</button>
<button class="p-1 text-gray-500 hover:bg-gray-200 rounded hover:text-gray-700">
<span class="material-symbols-outlined text-[18px]">format_underlined</span>
</button>
<div class="w-px h-4 bg-gray-300 mx-2"></div>
<button class="p-1 text-gray-500 hover:bg-gray-200 rounded hover:text-gray-700">
<span class="material-symbols-outlined text-[18px]">format_list_bulleted</span>
</button>
<button class="p-1 text-gray-500 hover:bg-gray-200 rounded hover:text-gray-700">
<span class="material-symbols-outlined text-[18px]">link</span>
</button>
<button class="p-1 text-gray-500 hover:bg-gray-200 rounded hover:text-gray-700">
<span class="material-symbols-outlined text-[18px]">image</span>
</button>
</div>
<textarea class="w-full border-none p-4 min-h-[200px] focus:ring-0 text-gray-700 text-base" placeholder="Write the details of your announcement here..."></textarea>
</div>
</div>
</div>
<div class="flex flex-col gap-4 mt-8 px-4 sm:px-0">
<div class="flex items-center gap-4 border-b border-gray-200 pb-4">
<button
    class="hover:bg-primary/90 text-primary border-b-2 border-primary px-1 py-2 text-sm font-bold transition-colors">Send
    message</button>
<button class="hover:bg-gray-200 text-gray-700 px-1 py-2 text-sm font-medium transition-colors">Log
    note</button>
<button
    class="hover:bg-gray-200 text-gray-700 px-1 py-2 text-sm font-medium transition-colors">Activities</button>
<div class="flex-1"></div>
<div class="flex items-center gap-6">
<button class="text-gray-400 hover:text-primary">
<span class="material-symbols-outlined text-[20px]">person_add</span>
</button>
<button class="text-gray-400 text-sm font-medium flex items-center gap-1">
<span class="material-symbols-outlined text-[18px] fill-1">star</span>
                             Following
                        </button>
</div>
</div>
<div class="flex gap-4 items-start py-4 opacity-75">
<div class="size-8 rounded-full bg-gray-200 overflow-hidden shrink-0">
<img class="w-full h-full object-cover grayscale opacity-60" data-alt="User profile avatar" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAtLPoctX8BjJQdmoGiR7oxZnEMkJ4X6GajFyBZQw8NmrB75O_ICMDGudNyRqbr-xgB4T6n0aFvRkgbTQ97JwxHE7qoWveguu6Tp-neBxVCwoq82UL7WL8Unz_EH_bJrXseW1znXjOn1hNSniBevf613YxdXrMy-EVttCR_wzsa-dsx4eudABL144FWfIEvJ1XNHhKbK-mSMgVBRxd2AA3xcnqgdXzBT7Gg5DNnQBDrke9-Buo2GgSBF2EiRG4724oxUi-2ExE5qv4"/>
</div>
<div class="flex-1 bg-gray-50 rounded-lg p-3 border border-gray-100">
<div class="flex items-center gap-2 mb-1">
<span class="font-semibold text-sm text-gray-700">Mitchell Admin</span>
<span class="text-xs text-gray-400">now</span>
</div>
<p class="text-sm text-gray-500 italic">Creating a new record...</p>
</div>
</div>
</div>
</div>
</main>

<!-- JavaScript Files -->
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/app.js"></script>
</body></html>
