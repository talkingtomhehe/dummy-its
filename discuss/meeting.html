<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

<script id="tailwind-config">

        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0014A8",
              "primary-dark": "#000f7d",
              "background-light": "#f5f6f8",
              "background-dark": "#0f1123",
            },
            fontFamily: {
              "display": ["Roboto", "sans-serif"],
              "sans": ["Roboto", "sans-serif"],
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }

<style>

            -ms-overflow-style: none;

        }

<body class="bg-[#F9FAFB] text-[#101118] font-display h-screen flex flex-col overflow-hidden">
<header class="flex items-center justify-between whitespace-nowrap bg-primary px-4 py-2 shrink-0 z-20 shadow-md h-[46px]">
<div class="flex items-center gap-4 text-white">
<button class="flex items-center justify-center p-1 hover:bg-white/10 rounded">
<span class="material-symbols-outlined text-[24px]">apps</span>
</button>
<div class="flex flex-col">
<h2 class="text-white text-base font-bold leading-tight tracking-tight">DISCUSS</h2>
</div>
<div class="hidden md:flex gap-6 ml-4 text-sm font-medium text-white/90">
<a class="hover:text-white" href="#">Configuration</a>
</div>
</div>
<div class="flex items-center gap-6">
  <div class="flex items-center gap-3">
    <button class="text-white/80 hover:text-white p-1 relative">
      <span class="material-symbols-outlined text-[20px]">schedule</span>
    </button>
    <button class="text-white/80 hover:text-white p-1 relative">
      <span class="material-symbols-outlined text-[20px]">chat_bubble</span>
      <span class="absolute top-0 right-0 size-2 bg-[#E53835] rounded-full border border-primary"></span>
    </button>
    <div class="size-8 rounded-full bg-white/20 overflow-hidden ml-2 cursor-pointer border border-white/30">

    </div>
  </div>
</div>
</header>
<div class="flex flex-1 overflow-hidden">
<aside class="w-[260px] lg:w-1/5 bg-white border-r border-gray-200 flex flex-col shrink-0">
<div class="p-3">
<button class="w-full bg-white hover:bg-[#0175C8] hover:text-white text-[#0175C8] border border-[#0175C8] rounded py-1.5 px-3 flex items-center justify-center gap-2 text-sm font-medium shadow-sm transition-colors mb-4">
<span class="material-symbols-outlined text-[20px]">videocam</span>
                    Start a meeting
                </button>
<nav class="flex flex-col gap-0.5 text-sm text-gray-700">
<a class="flex items-center gap-3 px-3 py-1.5 rounded hover:bg-gray-100 group" href="#">
<span class="material-symbols-outlined text-[20px] text-gray-400 group-hover:text-gray-600">inbox</span>
<span class="font-medium">Inbox</span>
<span class="ml-auto bg-[#0175C8] text-white text-[10px] font-bold px-1.5 rounded-full">4</span>
</a>
<a class="flex items-center gap-3 px-3 py-1.5 rounded hover:bg-gray-100 group" href="#">
<span class="material-symbols-outlined text-[20px] text-gray-400 group-hover:text-gray-600">star</span>
<span class="font-medium">Starred</span>
</a>
<a class="flex items-center gap-3 px-3 py-1.5 rounded hover:bg-gray-100 group" href="#">
<span class="material-symbols-outlined text-[20px] text-gray-400 group-hover:text-gray-600">history</span>
<span class="font-medium">History</span>
</a>
</nav>
<div class="mt-6">
<div class="flex items-center justify-between px-3 mb-1 group cursor-pointer">
<h3 class="text-xs font-bold text-gray-500 uppercase">Channels</h3>
<span class="material-symbols-outlined text-[16px] text-gray-400 opacity-0 group-hover:opacity-100 hover:text-gray-600">add</span>
</div>
<nav class="flex flex-col gap-0.5 text-sm text-gray-700">
<a class="flex items-center gap-3 px-3 py-1.5 rounded hover:bg-gray-100 text-gray-600" href="#">
<span class="text-lg leading-none text-gray-400">#</span>
<span class="truncate">Administrators</span>
</a>
<a class="flex items-center gap-3 px-3 py-1.5 rounded hover:bg-gray-100 text-gray-600" href="#">
<span class="text-lg leading-none text-gray-400">#</span>
<span class="truncate">general</span>
</a>
</nav>
</div>
<div class="mt-6">
<div class="flex items-center justify-between px-3 mb-1 group cursor-pointer">
<h3 class="text-xs font-bold text-gray-500 uppercase">Direct Messages</h3>
<span class="material-symbols-outlined text-[16px] text-gray-400 opacity-0 group-hover:opacity-100 hover:text-gray-600">add</span>
</div>
<nav class="flex flex-col gap-0.5 text-sm text-gray-700">
<a class="flex items-center gap-3 px-3 py-1.5 rounded bg-gray-200 text-gray-900 font-medium" href="#">
<div class="relative shrink-0">
<div class="bg-center bg-no-repeat bg-cover rounded h-4 w-4 shadow-sm" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCZ9IwqZLMVyFuvjD48r6YmxNecS2IrNMxG2dFNdOE52RuIygLm-jHTDoZtgyBLmLKKdD-TTsuUZVou2vdbxd0D9QR6pC_XY_z2cK-Ec_i7mICjIvR4YPbKET2bazHwZFPJKC_OyGs2Us9f1RopSTgaqSV7l4gG5EcUzhWMP3Azd4xOdVEL64x6f7WLJRJvnmpLmkD5Y63-k_4Z7bhbwIrH61E8LwjgddbaPgANhGtx_Tjkt5DESNWq0Mj89htAHSboNhEooCbGTMI");'></div>
<span class="absolute -bottom-0.5 -right-0.5 block h-2 w-2 rounded-full bg-green-500 ring-1 ring-white"></span>
</div>
<span class="truncate">Mitchell Admin</span>
<span class="material-symbols-outlined text-[16px] text-gray-600 ml-auto">volume_up</span>
</a>
<a class="flex items-center gap-3 px-3 py-1.5 rounded hover:bg-gray-100 group" href="#">
<div class="relative">
<div class="w-4 h-4 rounded bg-indigo-100 text-indigo-600 flex items-center justify-center text-[10px] font-bold">O</div>
<span class="absolute -bottom-0.5 -right-0.5 block h-2 w-2 rounded-full bg-green-500 ring-2 ring-white"></span>
</div>
<span class="truncate">OnfisBot</span>
</a>
</nav>
</div>
</div>
</aside>
<main class="flex-1 flex flex-col min-w-0 bg-white">
<div class="h-14 border-b border-gray-200 flex items-center justify-between px-4 shrink-0">
<div class="flex items-center gap-3">
<div class="bg-center bg-no-repeat bg-cover rounded h-8 w-8 shadow-sm border border-gray-100" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCZ9IwqZLMVyFuvjD48r6YmxNecS2IrNMxG2dFNdOE52RuIygLm-jHTDoZtgyBLmLKKdD-TTsuUZVou2vdbxd0D9QR6pC_XY_z2cK-Ec_i7mICjIvR4YPbKET2bazHwZFPJKC_OyGs2Us9f1RopSTgaqSV7l4gG5EcUzhWMP3Azd4xOdVEL64x6f7WLJRJvnmpLmkD5Y63-k_4Z7bhbwIrH61E8LwjgddbaPgANhGtx_Tjkt5DESNWq0Mj89htAHSboNhEooCbGTMI");'></div>
<div class="flex flex-col justify-center">
<h2 class="text-gray-900 font-bold text-base leading-none">Mitchell Admin</h2>
</div>
</div>
<div class="flex items-center gap-3 text-gray-400">
<button class="hover:text-primary hover:bg-gray-100 p-2 rounded-full transition-colors relative">
<span class="material-symbols-outlined text-[20px]">notifications</span>
</button>
<button class="hover:text-primary hover:bg-gray-100 p-2 rounded-full transition-colors">
<span class="material-symbols-outlined text-[20px]">person_add</span>
</button>
<button class="hover:text-primary hover:bg-gray-100 p-2 rounded-full transition-colors">
<span class="material-symbols-outlined text-[20px]">search</span>
</button>
<div class="h-4 w-px bg-gray-300 mx-1"></div>
<button class="hover:text-primary hover:bg-gray-100 p-2 rounded-full transition-colors">
<span class="material-symbols-outlined text-[20px]">attach_file</span>
</button>
<button class="hover:text-primary hover:bg-gray-100 p-2 rounded-full transition-colors">
<span class="material-symbols-outlined text-[20px]">push_pin</span>
</button>
<button class="hover:text-primary hover:bg-gray-100 p-2 rounded-full transition-colors text-[#0175C8] bg-[#0175C8]/10 py-1">
<span class="material-symbols-outlined text-[20px]">group</span>
</button>
</div>
</div>
<div class="flex-1 flex flex-col p-4 md:p-6 pb-2 min-h-0 bg-[#F9FAFB] overflow-y-auto">
<div class="bg-black rounded-xl shadow-lg flex-1 relative min-h-[400px] overflow-hidden group">
<div class="absolute inset-0 flex items-center justify-center">
<div class="bg-gray-800 rounded-full h-32 w-32 flex items-center justify-center text-white text-4xl font-bold bg-cover bg-center" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCZ9IwqZLMVyFuvjD48r6YmxNecS2IrNMxG2dFNdOE52RuIygLm-jHTDoZtgyBLmLKKdD-TTsuUZVou2vdbxd0D9QR6pC_XY_z2cK-Ec_i7mICjIvR4YPbKET2bazHwZFPJKC_OyGs2Us9f1RopSTgaqSV7l4gG5EcUzhWMP3Azd4xOdVEL64x6f7WLJRJvnmpLmkD5Y63-k_4Z7bhbwIrH61E8LwjgddbaPgANhGtx_Tjkt5DESNWq0Mj89htAHSboNhEooCbGTMI");'>
</div>
</div>
<div class="absolute bottom-4 left-4 z-10">
<span class="text-white font-semibold text-lg drop-shadow-md">Mitchell Admin</span>
</div>
<div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex items-center gap-3 z-20">
<button class="w-10 h-10 rounded-full bg-[#2d2d2d] hover:bg-[#3d3d3d] flex items-center justify-center text-white shadow-lg transition-colors border border-white/10" title="Mute">
<span class="material-symbols-outlined text-[20px]">mic</span>
</button>
<button class="w-10 h-10 rounded-full bg-[#2d2d2d] hover:bg-[#3d3d3d] flex items-center justify-center text-white shadow-lg transition-colors border border-white/10" title="Deafen">
<span class="material-symbols-outlined text-[20px]">headphones</span>
</button>
<button class="w-10 h-10 rounded-full bg-[#2d2d2d] hover:bg-[#3d3d3d] flex items-center justify-center text-white shadow-lg transition-colors border border-white/10" title="Turn off camera">
<span class="material-symbols-outlined text-[20px]">videocam</span>
</button>
<button class="w-10 h-10 rounded-full bg-[#2d2d2d] hover:bg-[#3d3d3d] flex items-center justify-center text-white shadow-lg transition-colors border border-white/10" title="Share Screen">
<span class="material-symbols-outlined text-[20px]">screen_share</span>
</button>
<button class="w-10 h-10 rounded-full bg-[#2d2d2d] hover:bg-[#3d3d3d] flex items-center justify-center text-white shadow-lg transition-colors border border-white/10" title="Options">
<span class="material-symbols-outlined text-[20px]">more_vert</span>
</button>
<button class="w-12 h-12 rounded-full bg-red-600 hover:bg-red-700 flex items-center justify-center text-white shadow-lg transition-colors ml-2" title="End Call">
<span class="material-symbols-outlined text-[24px]">call_end</span>
</button>
</div>
</div>
<div class="mt-4 flex flex-col">
<div class="flex items-center justify-center mb-4">
<span class="text-xs text-gray-500 bg-gray-100 px-3 py-1 rounded-full">Today - Mitchell Admin started a live conference</span>
</div>
<div class="relative flex items-center bg-white border border-gray-300 rounded-lg shadow-sm">
<input class="w-full pl-4 pr-32 py-3 bg-transparent border-none focus:ring-0 text-sm transition-all placeholder:text-gray-500 rounded-lg" placeholder="Message Mitchell Admin..." type="text"/>
<div class="absolute right-2 flex items-center gap-1">
<button class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded transition-colors"><span class="material-symbols-outlined text-[20px]">sentiment_satisfied</span></button>
<button class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded transition-colors"><span class="material-symbols-outlined text-[20px]">attach_file</span></button>
<button class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded transition-colors"><span class="material-symbols-outlined text-[20px]">mic</span></button>
<button class="p-1.5 text-primary hover:text-primary-dark hover:bg-blue-50 rounded transition-colors ml-1"><span class="material-symbols-outlined text-[20px] fill-current" style="font-variation-settings: 'FILL' 1;">send</span></button>
</div>
</div>
<div class="text-[10px] text-gray-400 mt-1 pl-1">
<span class="font-semibold">Enter</span> to send, <span class="font-semibold">Shift + Enter</span> for new line
                    </div>
</div>
</div>
</main>
</div>
